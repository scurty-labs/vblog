@include 'header'

@include 'admin_bar'

<div class="site-shell">

@include 'sidebar'

<main class="site-main content">

<!-- Posts -->
<section id="posts" class="post-list">

@for post in blog_posts
@include 'post_card'
@end

</section>

@if total_pages > 1

<nav class="pagination pure-menu pure-menu-horizontal" aria-label="Pagination">
<ul class="page_list pure-menu-list">
@for page in ctx.page_links
	@if page == 0
	<li class="pure-menu-item page-item page-gap" aria-hidden="true">
		<span class="page-gap-mark">…</span>
	</li>
	@else if page == 1
	<li class="pure-menu-item page-item pure-menu-selected">
		<a href="/page/@page" class="pure-menu-link page-link is-current" aria-current="page">@page</a>
	</li>
	@else
	<li class="pure-menu-item page-item">
		<a href="/page/@page" class="pure-menu-link page-link">@page</a>
	</li>
	@end
@end
</ul>
</nav>

@end

</main>

</div>

@include 'footer'
