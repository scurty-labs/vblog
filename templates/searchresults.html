@include 'header'

@include 'admin_bar'

<div class="site-shell">

@include 'sidebar'

<main class="site-main content">

<!-- Posts -->
<section id="posts" class="post-list">

<header class="search-summary">
@if rel_post.len>=1
	<h3 class="search-heading">Found @rel_post.len result(s) related to '@query'</h3>
@else
	<h3 class="search-heading">No results found for '@query'.</h3>
@end
</header>

@for post in rel_post
@include 'post_card'
@end

</section>

</main>

</div>

@include 'footer'
