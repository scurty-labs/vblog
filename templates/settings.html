@include 'header'

<div class="dash">
@include 'admin_nav'
<main class="dash-main">

	<header class="dash-topbar">
		<div class="dash-heading">
			<p class="dash-eyebrow">Admin</p>
			<h1 class="dash-title">Settings</h1>
			<p class="dash-subtitle">Blog identity, posting defaults and the look of every page.</p>
		</div>
		<div class="dash-actions">
			<a class="pure-button" href="/admin"><svg class="icon" aria-hidden="true"><use href="#i-grid"></use></svg>Dashboard</a>
		</div>
	</header>

	@if ctx.invalid_settings
	<p class="form-error">Couldn't save settings. Please try again.</p>
	@end

	<form class="dash-panel pure-form form-stack" method="post" action="/save/settings">
		<label class="field">
			<span class="field-label">Blog Title</span>
			<input class="field-input" type="text" name="blog_title" value="@ctx.settings.blog_title">
		</label>
		<label class="field">
			<span class="field-label">Blog Description</span>
			<textarea class="field-input field-textarea" name="blog_description">@ctx.settings.blog_description</textarea>
		</label>
		<label class="field">
			<span class="field-label">Footer Text <span class="editor-hint">Markdown links allowed</span></span>
			<textarea class="field-input field-textarea footer-input" name="footer_text" rows="3">@ctx.settings.footer_text</textarea>
		</label>
		<div class="field-row">
			<label class="field">
				<span class="field-label">Posts Per Page</span>
				<input class="field-input" type="number" name="posts_per_page" min="1" max="100" value="@ctx.settings.posts_per_page">
			</label>
			<label class="field">
				<span class="field-label">Accent Color</span>
				<input class="field-input" type="text" name="accent_foreground" value="@ctx.settings.accent_foreground">
			</label>
		</div>
		<label class="field">
			<span class="field-label">Theme</span>
			<select class="field-input field-select" name="theme">
@for theme in ctx.themes
	@if theme == ctx.settings.theme
				<option value="@theme" selected>@ctx.theme_label(theme)</option>
	@else
				<option value="@theme">@ctx.theme_label(theme)</option>
	@end
@end
			</select>
		</label>
		<button class="button-success pure-button" type="submit"><svg class="icon" aria-hidden="true"><use href="#i-check"></use></svg>Save settings</button>
	</form>

</main>
</div>

@include 'footer'
