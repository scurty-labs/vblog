@include 'header'

@if ctx.is_admin

	<div class="pure-g">
	
	<div class="pure-u-1">
	<div class="page_header"><h2>Blog Settings</h2></div>
	</div>
	
	<div class="pure-u-1 pure-u-md-1-4"></div>
	<div class="page_content pure-u-1 pure-u-md-1-2">
		@if ctx.invalid_settings
		<p style="color: #b00020;">Couldn't save settings. Please try again.</p>
		@end
		<form class="pure-form" method="post" action="save/settings">
			<input style="width: 100%;" type="text" name="blog_title" value="@ctx.settings.blog_title"><br/><br/>
			<textarea style="width: 100%;" name="blog_description">@ctx.settings.blog_description</textarea><br/><br/>
			<p>Posts Per Page</p>
			<input type="number" name="posts_per_page" min="1" max="100" value="@ctx.settings.posts_per_page">
			<p>Accent Color</p>
			<input type="text" name="accent_foreground" value="@ctx.settings.accent_foreground"><br/><br/>
			<p>Theme</p>
			<select name="theme">
@for theme in ctx.themes
	@if theme == ctx.settings.theme
				<option value="@theme" selected>@theme</option>
	@else
				<option value="@theme">@theme</option>
	@end
@end
			</select><br/><br/>
			<br/>
			<button class="button-success pure-button" type="submit" >Save</button>
		</form>
	
	</div>
	<div class="pure-u-1 pure-u-md-1-4"></div>

@end

</body>
</html>
